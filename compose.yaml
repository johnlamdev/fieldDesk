services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fielddesk
      POSTGRES_USER: fielddesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private environment file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fielddesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielddesk -d fielddesk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fielddesk_pg:
